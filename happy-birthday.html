<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday</title>
<style>
  :root{
    --deep: #050b1e;
    --navy: #0b1740;
    --blue: #2952c8;
    --skyblue: #6fa8ff;
    --silver: #d7dee8;
    --silver-bright: #f4f7fb;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  html,body{
    height:100%;
    background: radial-gradient(ellipse at 50% 20%, var(--navy) 0%, var(--deep) 65%, #020510 100%);
    font-family: 'Georgia', 'Iowan Old Style', serif;
    overflow-x:hidden;
    color: var(--silver-bright);
  }

  /* starfield */
  #stars, #stars2, #stars3{
    position:fixed; top:0; left:0; width:100%; height:100%;
    background:transparent;
    pointer-events:none;
  }

  .wrap{
    position:relative;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding: 40px 20px 80px;
    text-align:center;
  }

  .eyebrow{
    font-family:'Helvetica Neue', Arial, sans-serif;
    letter-spacing: 0.45em;
    text-transform:uppercase;
    font-size: 0.7rem;
    color: var(--skyblue);
    margin-bottom: 28px;
    opacity:0.85;
  }

  /* orbit system */
  .orbit-stage{
    position:relative;
    width: min(420px, 80vw);
    height: min(420px, 80vw);
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom: 36px;
  }

  .ring{
    position:absolute;
    border-radius:50%;
    border: 1px solid rgba(215,222,232,0.18);
  }
  .ring1{ width:100%; height:100%; }
  .ring2{ width:70%; height:70%; }

  .orbiter{
    position:absolute;
    top:0; left:0; width:100%; height:100%;
    animation: spin linear infinite;
  }
  .orbiter .body{
    position:absolute;
    top:-6px; left:50%;
    transform:translateX(-50%);
    width:12px; height:12px;
    border-radius:50%;
    background: var(--silver-bright);
    box-shadow: 0 0 10px 2px rgba(244,247,251,0.8), 0 0 24px 6px rgba(111,168,255,0.5);
  }
  .orbiter.slow{ animation-duration: 18s; }
  .orbiter.slower{ animation-duration: 26s; }
  .orbiter.rev{ animation-direction: reverse; animation-duration: 22s; }

  @keyframes spin{
    from{ transform: rotate(0deg); }
    to{ transform: rotate(360deg); }
  }

  .core{
    position:relative;
    z-index:2;
    width: 58%;
    height: 58%;
    border-radius:50%;
    background: radial-gradient(circle at 35% 30%, var(--skyblue), var(--blue) 55%, #14286b 100%);
    box-shadow:
      0 0 40px 10px rgba(41,82,200,0.55),
      inset -12px -12px 30px rgba(0,0,0,0.35),
      inset 8px 8px 20px rgba(255,255,255,0.15);
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .core-label{
    font-family:'Helvetica Neue', Arial, sans-serif;
    font-size: 0.65rem;
    letter-spacing:0.3em;
    text-transform:uppercase;
    color: rgba(244,247,251,0.75);
  }

  h1{
    font-size: clamp(2.2rem, 6vw, 3.6rem);
    font-weight:400;
    line-height:1.1;
    background: linear-gradient(180deg, var(--silver-bright), var(--silver) 60%, var(--skyblue));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    margin-bottom: 14px;
  }

  h1 .name{
    font-style:italic;
  }

  p.message{
    max-width: 520px;
    font-size: 1.05rem;
    line-height:1.7;
    color: var(--silver);
    margin: 0 auto 34px;
  }

  .divider{
    width:1px;
    height:40px;
    background: linear-gradient(var(--skyblue), transparent);
    margin: 0 auto 34px;
  }

  /* player */
  .player{
    display:flex;
    align-items:center;
    gap:14px;
    background: rgba(215,222,232,0.06);
    border: 1px solid rgba(215,222,232,0.25);
    border-radius: 40px;
    padding: 10px 22px 10px 10px;
    backdrop-filter: blur(6px);
  }

  .play-btn{
    width:44px; height:44px;
    border-radius:50%;
    border: none;
    background: linear-gradient(145deg, var(--skyblue), var(--blue));
    color: var(--silver-bright);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    flex-shrink:0;
    box-shadow: 0 0 14px rgba(111,168,255,0.6);
    transition: transform 0.2s ease;
  }
  .play-btn:hover{ transform: scale(1.06); }
  .play-btn svg{ width:16px; height:16px; }

  .track-info{
    text-align:left;
    font-family:'Helvetica Neue', Arial, sans-serif;
  }
  .track-title{ font-size:0.85rem; color: var(--silver-bright); }
  .track-artist{ font-size:0.7rem; color: var(--skyblue); letter-spacing:0.05em; }

  footer{
    margin-top: 48px;
    font-family:'Helvetica Neue', Arial, sans-serif;
    font-size: 0.68rem;
    letter-spacing:0.2em;
    text-transform:uppercase;
    color: rgba(215,222,232,0.4);
  }

  .gallery-label{
    margin-top: 56px;
    margin-bottom: 22px;
    font-family:'Helvetica Neue', Arial, sans-serif;
    font-size: 0.7rem;
    letter-spacing:0.35em;
    text-transform:uppercase;
    color: var(--skyblue);
    opacity:0.85;
  }

  .gallery{
    display:grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
    max-width: 480px;
    width: 100%;
  }

  .gallery-item{
    margin:0;
    position:relative;
    border-radius: 14px;
    overflow:hidden;
    border: 1px solid rgba(215,222,232,0.22);
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    aspect-ratio: 3/4;
  }

  .gallery-item img{
    width:100%; height:100%;
    object-fit: cover;
    display:block;
    filter: saturate(0.92) brightness(0.96);
    transition: transform 0.4s ease;
  }

  .gallery-item:hover img{
    transform: scale(1.04);
  }

  @media (max-width: 480px){
    .gallery{ grid-template-columns: repeat(2, 1fr); gap: 10px; }
  }

  @media (prefers-reduced-motion: reduce){
    .orbiter{ animation: none; }
  }
</style>
</head>
<body>

<canvas id="stars"></canvas>

<div class="wrap">
  <div class="eyebrow">A message, sent into orbit</div>

  <div class="orbit-stage">
    <div class="ring ring1"></div>
    <div class="ring ring2"></div>

    <div class="orbiter slow">
      <div class="body"></div>
    </div>
    <div class="orbiter rev">
      <div class="body" style="width:8px;height:8px;top:-4px;"></div>
    </div>
    <div class="orbiter slower">
      <div class="body" style="width:6px;height:6px;top:-3px; box-shadow:0 0 8px 2px rgba(244,247,251,0.7);"></div>
    </div>

    <div class="core">
      <span class="core-label">Est. Today</span>
    </div>
  </div>

  <h1>Happy Birthday,<br><span class="name">Friend</span></h1>
  <p class="message">
    Another trip around the sun, complete. Here's to the year ahead —
    may it hold everything you're hoping for, and a little you didn't
    see coming.
  </p>

  <div class="divider"></div>

  <div class="player">
    <iframe
      width="260" height="66"
      src="https://www.youtube.com/embed/OFcKm-5jSQE?rel=0"
      title="Orbiter - Noah Kahan"
      frameborder="0"
      style="border-radius: 14px;"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
      allowfullscreen>
    </iframe>
  </div>

  <div class="gallery-label">A few moments worth orbiting back to</div>
  <div class="gallery">
    <figure class="gallery-item"><img src="photo-1-1.jpg" alt="Photo 1"></figure>
    <figure class="gallery-item"><img src="photo-2-1.jpg" alt="Photo 2"></figure>
    <figure class="gallery-item"><img src="photo-3-1.jpg" alt="Photo 3"></figure>
    <figure class="gallery-item"><img src="photo-4-1.jpg" alt="Photo 4"></figure>
  </div>

  <footer>Made with love</footer>
</div>

<script>
  // Starfield
  const canvas = document.getElementById('stars');
  const ctx = canvas.getContext('2d');
  let stars = [];

  function resize(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    stars = [];
    const count = Math.floor((canvas.width * canvas.height) / 6000);
    for(let i=0;i<count;i++){
      stars.push({
        x: Math.random()*canvas.width,
        y: Math.random()*canvas.height,
        r: Math.random()*1.4 + 0.2,
        a: Math.random(),
        speed: Math.random()*0.015 + 0.003
      });
    }
  }
  window.addEventListener('resize', resize);
  resize();

  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    for(const s of stars){
      s.a += s.speed;
      const alpha = (Math.sin(s.a)+1)/2 * 0.8 + 0.2;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
      ctx.fillStyle = `rgba(244,247,251,${alpha})`;
      ctx.fill();
    }
    requestAnimationFrame(draw);
  }
  draw();

  // Playback handled natively by the embedded YouTube player.
</script>

</body>
</html>
